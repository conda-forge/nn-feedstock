schema_version: 1

context:
  version: "1.86.0"
  commit: 33cbf70dec4f64836a26dcb4a885cb09b7279dd3

package:
  name: nn
  version: ${{ version }}

source:
  url: https://github.com/sakov/nn-c/archive/${{ commit }}.tar.gz
  sha256: eb00f951bbe36e933d16de520db44acf93e9becf6e0182e391c1c7f98441972b
  patches:
    # Backport of upstream nn-c commit 283e997 (in v2.0.10) to avoid pointer
    # truncation on win-64, where unsigned long is 32 bit
    - patches/changes-to-use-size_t-instead-of-unsigned-long-to-po.patch
    - patches/use-the-c99-math-functions-of-the-msvc-runtime.patch
    - patches/provide-gettimeofday-for-the-standalone-minell-with-.patch

build:
  number: 2005

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: unix
      then:
        - make

tests:
  - script:
      - nnbathy -V
  - package_contents:
      bin:
        - nnbathy
        - minell
      include:
        - nn.h
      lib:
        - if: unix
          then: libnn.a
          else: nn.lib

about:
  homepage: https://github.com/sakov/nn-c
  summary: Natural Neighbours interpolation.
  # The bundled Triangle code (nn/triangle.c) is non-free for commercial use.
  license: BSD-2-Clause AND LicenseRef-Triangle
  license_file: nn/LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
